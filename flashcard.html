<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flashcard - ChineseMaster</title>

<link rel="stylesheet" href="css/style.css">


<style>

.flashcard-box{

max-width:400px;

height:300px;

margin:40px auto;

perspective:1000px;

}


.flashcard{

width:100%;

height:100%;

position:relative;

transition:.6s;

transform-style:preserve-3d;

cursor:pointer;

}



.flashcard.active{

transform:rotateY(180deg);

}



.front,
.back{

position:absolute;

width:100%;

height:100%;

background:white;

border-radius:30px;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

box-shadow:0 15px 35px rgba(0,0,0,.12);

backface-visibility:hidden;

}



.front h1{

font-size:60px;

color:#6d28d9;

}



.back{

transform:rotateY(180deg);

}



.action{

text-align:center;

}


.action button{

padding:12px 20px;

border:0;

border-radius:20px;

margin:5px;

cursor:pointer;

background:#7c3aed;

color:white;

}



</style>


</head>


<body>


<header class="header">


<div class="logo">
🃏 Flashcard
</div>


<a href="index.html">
Trang chủ
</a>


</header>





<section class="container">


<h2 style="text-align:center">

Từ hôm nay

</h2>





<div class="flashcard-box">


<div class="flashcard" onclick="flipCard()">



<div class="front">


<h1>
學習
</h1>


<p>
Nhấn để xem nghĩa
</p>


</div>





<div class="back">


<h2>
xuéxí
</h2>


<p>
ㄒㄩㄝˊ ㄒㄧˊ
</p>


<h2>
Học tập
</h2>


<p>
我學習中文。
</p>


<p>
Tôi học tiếng Trung.
</p>


</div>



</div>


</div>







<div class="action">


<button>
🔊 Nghe
</button>


<button>
❤️ Lưu
</button>


<button>
✅ Đã nhớ
</button>


<button>
❌ Ôn lại
</button>


</div>




</section>





<script>


function flipCard(){

document
.querySelector(".flashcard")
.classList
.toggle("active");


}



</script>



<script src="js/app.js"></script>


</body>

</html>
