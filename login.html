<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đăng nhập - ChineseMaster</title>

<link rel="stylesheet" href="css/style.css">


<style>

.login-box{

max-width:420px;

margin:60px auto;

background:white;

padding:35px;

border-radius:30px;

box-shadow:0 15px 35px rgba(0,0,0,.1);

}



.login-box input{

width:100%;

padding:15px;

margin:10px 0;

border-radius:15px;

border:1px solid #ddd;

font-size:16px;

}



.login-box button{

width:100%;

padding:15px;

border:0;

border-radius:20px;

background:#7c3aed;

color:white;

font-size:17px;

cursor:pointer;

}



.social{

margin-top:15px;

background:#f5f3ff;

padding:15px;

border-radius:20px;

text-align:center;

}



</style>


</head>



<body>



<header class="header">


<div class="logo">
🇨🇳 ChineseMaster AI
</div>


<a href="index.html">
Trang chủ
</a>


</header>





<section class="container">



<div class="login-box">


<h1>
🔐 Đăng nhập
</h1>


<p>
Học tiếng Trung thông minh cùng AI
</p>



<input 
type="email"
placeholder="Email">


<input 
type="password"
placeholder="Mật khẩu">



<button onclick="login()">

Đăng nhập

</button>





<div class="social">

🌐 Đăng nhập Google

</div>



<p style="text-align:center">

Chưa có tài khoản?

<br>

<a href="register.html">

Đăng ký ngay

</a>


</p>



</div>


</section>







<script>


function login(){


alert(
"Đăng nhập thành công!"
);


window.location.href="profile.html";


}


</script>



</body>

</html>
