<style>

.profile-box{

max-width:500px;

margin:auto;

}



.profile-header{

background:white;

padding:30px;

border-radius:30px;

text-align:center;

box-shadow:0 10px 30px rgba(0,0,0,.1);

}



.avatar-big{

width:100px;

height:100px;

border-radius:50%;

background:#7c3aed;

color:white;

font-size:50px;

display:flex;

align-items:center;

justify-content:center;

margin:auto;

}



.info{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:10px;

margin-top:25px;

}



.info div{

background:#f5f3ff;

padding:15px;

border-radius:20px;

}



.progress{

background:#ddd;

height:12px;

border-radius:20px;

}



.progress span{

display:block;

width:75%;

height:100%;

background:#7c3aed;

border-radius:20px;

}



.badges{

display:flex;

gap:10px;

}



.badge{

flex:1;

background:white;

padding:15px;

border-radius:20px;

text-align:center;

box-shadow:0 5px 15px #ddd;

}



</style>


</head>
