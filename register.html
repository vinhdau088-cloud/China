<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đăng ký - ChineseMaster</title>

<link rel="stylesheet" href="css/style.css">


<style>

.register-box{

max-width:450px;

margin:50px auto;

background:white;

padding:35px;

border-radius:30px;

box-shadow:0 15px 35px rgba(0,0,0,.1);

}



.register-box input,
.register-box select{

width:100%;

padding:15px;

margin:8px 0;

border-radius:15px;

border:1px solid #ddd;

font-size:16px;

}



.register-box button{

width:100%;

padding:15px;

margin-top:15px;

border:0;

border-radius:20px;

background:#7c3aed;

color:white;

font-size:17px;

cursor:pointer;

}


</style>


</head>


<body>



<header class="header">

<div class="logo">
🇨🇳 ChineseMaster AI
</div>


<a href="index.html">
Trang chủ
</a>

</header>





<section class="container">


<div class="register-box">


<h1>
🎓 Tạo tài khoản
</h1>


<p>
Bắt đầu hành trình học tiếng Trung
</p>



<input 
id="name"
placeholder="Họ và tên">



<input
id="email"
type="email"
placeholder="Email">



<input
type="password"
placeholder="Mật khẩu">





<select>

<option>
Mục tiêu học
</option>

<option>
HSK 1
</option>

<option>
HSK 3
</option>

<option>
HSK 5
</option>

<option>
TOCFL A2
</option>

<option>
TOCFL B1
</option>

</select>





<select>

<option>
Trình độ hiện tại
</option>

<option>
Mới bắt đầu
</option>

<option>
HSK 1
</option>

<option>
HSK 2
</option>

<option>
HSK 3+
</option>

</select>





<button onclick="registerUser()">

Đăng ký

</button>




<p style="text-align:center">

Đã có tài khoản?

<a href="login.html">
Đăng nhập
</a>

</p>



</div>


</section>





<script>


function registerUser(){


let user={

name:
document.getElementById("name").value,


email:
document.getElementById("email").value,


level:
"Beginner",


xp:0,


words:0

};



localStorage.setItem(
"user",
JSON.stringify(user)
);



alert(
"Tạo tài khoản thành công!"
);


window.location.href="profile.html";


}



</script>



</body>

</html>
